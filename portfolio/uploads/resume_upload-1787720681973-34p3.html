<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Churn Sheet — Gelato Production Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#FBFBFA;
  --ink:#182420; --ink-soft:#5C6B66; --ink-faint:#8B9793;
  --line:#DCE1DD; --line-soft:#EAEDE9;
  --teal:#134A4D; --teal-ink:#0D3536; --teal-soft:#E3EEEC;
  --copper:#B9793C; --copper-soft:#F6E9D8;
  --red:#B23A2E; --red-soft:#FBE6E3; --red-ink:#7A281F;
  --amber:#B3792A; --amber-soft:#FBEEDA; --amber-ink:#7A5216;
  --green:#2C7A55; --green-soft:#E3F2EA; --green-ink:#1E5A3E;
  --radius:10px; --radius-sm:6px; --radius-lg:16px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow: 0 1px 2px rgba(19,74,77,0.06), 0 4px 14px rgba(19,74,77,0.05);
  --groupA:#C9BFA0; --groupA-ink:#5B5136;
  --groupB:#8A6142; --groupB-ink:#3A2416;
  --groupC:#7E9A63; --groupC-ink:#3A4A2A;
  --groupD:#C79A56; --groupD-ink:#5C4218;
  --groupE:#7FB0A3; --groupE-ink:#2C4C43;
  --groupF:#A9C6C0; --groupF-ink:#2E4A44;
  --groupG:#CE7C61; --groupG-ink:#5C2C1E;
}
*{box-sizing:border-box;}
svg{width:18px; height:18px; display:block; flex-shrink:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  padding-bottom:78px;
}
h1,h2,h3,.disp{font-family:var(--font-display); letter-spacing:-0.01em;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
::selection{background:var(--teal-soft);}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

#app{max-width:560px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line);}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{width:28px; height:28px; border-radius:7px; background:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.brand-mark svg{width:16px; height:16px;}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:16.5px; color:var(--teal-ink);}
.role-chip{
  display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
  padding:6px 10px 6px 8px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  cursor:pointer;
}
.role-dot{width:7px; height:7px; border-radius:50%; background:var(--teal);}
.role-chip svg{width:13px; height:13px;}

/* ---------- Content ---------- */
.screen{padding:4px 16px 28px;}
.page-head{margin:6px 0 16px;}
.page-title{font-size:23px; font-weight:700; margin:0 0 2px; color:var(--teal-ink);}
.page-sub{font-size:13.5px; color:var(--ink-soft); margin:0;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card-flat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
.card-title{font-family:var(--font-display); font-weight:600; font-size:15px; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-box{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px;}
.stat-num{font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--teal-ink); line-height:1;}
.stat-label{font-size:11.5px; color:var(--ink-soft); margin-top:5px; text-transform:uppercase; letter-spacing:.04em;}

/* ---------- Badges / pills ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:99px; white-space:nowrap;}
.b-red{background:var(--red-soft); color:var(--red-ink);}
.b-amber{background:var(--amber-soft); color:var(--amber-ink);}
.b-green{background:var(--green-soft); color:var(--green-ink);}
.b-teal{background:var(--teal-soft); color:var(--teal-ink);}
.b-copper{background:var(--copper-soft); color:#7A4E1E;}
.b-neutral{background:var(--line-soft); color:var(--ink-soft);}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.dot-red{background:var(--red);} .dot-amber{background:var(--amber);} .dot-green{background:var(--green);}

.group-tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px 3px 6px; border-radius:99px;}
.gswatch{width:9px; height:9px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.12);}

/* ---------- Buttons ---------- */
.btn{
  border:none; border-radius:var(--radius); padding:11px 16px; font-weight:600; font-size:14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .05s ease, opacity .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal); color:#fff;}
.btn-copper{background:var(--copper); color:#fff;}
.btn-outline{background:var(--surface); color:var(--teal-ink); border:1px solid var(--line);}
.btn-ghost{background:transparent; color:var(--teal-ink); padding:8px 10px;}
.btn-danger{background:var(--red-soft); color:var(--red-ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px; font-size:12.5px; border-radius:var(--radius-sm);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-row{display:flex; gap:8px;}

/* ---------- Forms ---------- */
label.field-label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:0 0 5px; text-transform:uppercase; letter-spacing:.03em;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 11px;
  font-size:14.5px; font-family:var(--font-body); background:var(--surface); color:var(--ink);
}
textarea{resize:vertical; min-height:56px;}
.field{margin-bottom:12px;}
.seg{display:flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden;}
.seg button{flex:1; border:none; background:var(--surface); padding:9px 6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--teal); color:#fff;}

.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; width:fit-content;}
.stepper button{width:36px; height:36px; border:none; background:var(--surface-2); font-size:18px; font-weight:600; color:var(--teal-ink); cursor:pointer;}
.stepper button:active{background:var(--teal-soft);}
.stepper .val{width:44px; text-align:center; font-family:var(--font-mono); font-weight:600; font-size:15px;}
.stepper .val-input{width:44px; text-align:center; font-family:var(--font-mono); font-weight:600; font-size:15px; border:none; background:transparent; padding:8px 2px; color:var(--ink); -moz-appearance:textfield;}
.stepper .val-input::-webkit-outer-spin-button, .stepper .val-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.stepper .val-input:focus{outline:none; background:var(--teal-soft);}

/* ---------- Lists ---------- */
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:none;}
.row-main{flex:1; min-width:0;}
.row-title{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.row-title svg{width:14px; height:14px;}
.row-meta{font-size:12px; color:var(--ink-soft); margin-top:3px;}

/* ---------- Subtabs ---------- */
.subtabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.subtab{padding:8px 13px; border-radius:99px; font-size:13px; font-weight:600; background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0;}
.subtab.active{background:var(--teal-ink); color:#fff; border-color:var(--teal-ink);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px;
  background:var(--surface); border-top:1px solid var(--line); display:flex; z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.navbtn{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; cursor:pointer; color:var(--ink-faint);}
.navbtn svg{width:21px; height:21px;}
.navbtn.active{color:var(--teal-ink);}
.navbtn .lbl{font-size:10.5px; font-weight:600;}

/* ---------- Wash step ---------- */
.wash-step{
  display:flex; align-items:center; gap:10px; background:var(--teal-ink); color:#fff;
  border-radius:var(--radius); padding:12px 14px; margin:8px 0;
}
.wash-step svg{width:19px; height:19px; flex-shrink:0;}
.wash-step .wtext{flex:1; font-weight:600; font-size:13.5px;}
.wash-step.done{background:var(--green-soft); color:var(--green-ink);}

.churn-item{
  display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:12px 13px; margin:8px 0; border-left:4px solid var(--line);
}
.churn-item.locked{opacity:.45;}
.churn-item.done{background:var(--green-soft); border-color:var(--green-soft);}
.check-circle{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.check-circle.checked{background:var(--green); border-color:var(--green);}
.check-circle svg{width:14px; height:14px; color:#fff;}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,25,22,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{
  background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}
.modal-title{font-family:var(--font-display); font-weight:700; font-size:18px; margin:0 0 14px;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:36px 18px; color:var(--ink-soft);}
.empty svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
.empty p{margin:0; font-size:13.5px;}

/* ---------- Role select ---------- */
.role-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;}
.role-card{width:100%; max-width:360px;}
.role-opt{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; margin-bottom:11px; cursor:pointer;
  box-shadow:var(--shadow);
}
.role-opt:active{transform:scale(0.98);}
.role-icon{width:42px; height:42px; border-radius:11px; background:var(--teal-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.role-icon svg{width:21px; height:21px; color:var(--teal-ink);}
.role-opt-title{font-weight:700; font-size:15px;}
.role-opt-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}

.bar-track{height:8px; background:var(--line-soft); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; border-radius:99px;}

.toast{
  position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--teal-ink); color:#fff;
  padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600; z-index:60; box-shadow:var(--shadow);
  animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

.hint{font-size:12px; color:var(--ink-faint); line-height:1.5;}
.divider{height:1px; background:var(--line-soft); margin:14px 0;}
.link-btn{background:none; border:none; color:var(--teal-ink); font-weight:600; font-size:13px; cursor:pointer; padding:0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   GELATO PRODUCTION PLANNER — single-file app
   Data persists via window.storage (shared across all users
   of this artifact link — see README for details).
   ========================================================= */

/* ---------------- Icons (inline SVG, stroke-based) ---------------- */
const ICONS = {
  today: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  plan: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>`,
  churn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
  stock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8L12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>`,
  flavours: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c0-3 3.5-7 8-7s8 4 8 7-3 4-3 7a5 5 0 0 1-10 0c0-3-3-4-3-7z"/></svg>`,
  reports: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>`,
  wash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M9 3h6M8 3v2M16 3v2"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.5 17a1.8 1.8 0 0 0 1.6 2.7h15.8a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/></svg>`,
  scoop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9.5 14.5L6 21M14.5 14.5L18 21"/></svg>`,
  truck: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="14" height="10"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17.5" cy="19" r="2"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
  archive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.7L6 21l1.6-7L2.2 9.3l7.1-.7z"/></svg>`,
  bake: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="10" rx="1.5"/><path d="M7 10c0-2 1-3 1-5s-1-2-1-3M12 10c0-2 1-3 1-5s-1-2-1-3M17 10c0-2 1-3 1-5s-1-2-1-3"/></svg>`,
};
function icon(name,cls){ return `<span class="${cls||''}" style="display:inline-flex">${ICONS[name]||''}</span>`; }

/* ---------------- Constants ---------------- */
const DEFAULT_GROUPS = [
  {id:'A', name:'Group A', color:'#7FB0A3'},
  {id:'B', name:'Group B', color:'#8FA871'},
  {id:'C', name:'Group C', color:'#C9BFA0'},
  {id:'D', name:'Group D', color:'#8A6142'},
  {id:'E', name:'Group E', color:'#A9C6C0'},
  {id:'F', name:'Group F', color:'#8B5E7A'},
  {id:'G', name:'Group G', color:'#C25B6B'},
  {id:'H', name:'Group H', color:'#D9A63E'},
  {id:'I', name:'Group I', color:'#5B4636'},
  {id:'J', name:'Group J', color:'#C7A567'},
  {id:'K', name:'Group K', color:'#D6A9C9'},
  {id:'L', name:'Group L', color:'#A0B5D9'},
  {id:'M', name:'Group M', color:'#A8BFA0'},
  {id:'N', name:'Group N', color:'#D9C36A'},
  {id:'O', name:'Group O', color:'#C97D5A'},
  {id:'P', name:'Group P', color:'#7C9CA6'},
];
const GROUP_COLOR_PALETTE = ['#C9BFA0','#8A6142','#7E9A63','#C79A56','#7FB0A3','#A9C6C0','#CE7C61','#B58AC0','#8FB0D6','#D6A9C9','#A0B5D9','#D9C36A'];
function getGroups(){ return (DB && DB['wash-config'] && DB['wash-config'].groups) || DEFAULT_GROUPS; }
function groupOrderIds(){ return getGroups().map(g=>g.id); }
function groupInfo(id){ return getGroups().find(g=>g.id===id) || getGroups()[0] || {id:'?',name:'Unknown',color:'#ccc'}; }

const SHIFT_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DEFAULT_SHIFTS = {
  Tuesday:  {start:'10:00', end:'18:00'},
  Wednesday:{start:'13:00', end:'19:00'},
  Friday:   {start:'11:00', end:'19:00'},
  Saturday: {start:'12:00', end:'20:00'},
};
const DELIVERY_DAYS = ['Tuesday','Friday'];

const DEFAULT_SHIFT_SETTINGS = {
  shifts: DEFAULT_SHIFTS,
  setupMin: 40,
  cleanMin: 40,
  washMin: 20,
  defaultProdMinPerBladder: 15,
  bladdersPerHourPace: 3.5,
};

/* Special conditional wash rule: wash before Group D is only required
   if Coffee (group C) was actually churned in today's run. Defensively
   ignored if either group no longer exists (e.g. groups were restructured). */
const SPECIAL_WASH_RULE = { fromGroup:'C', toGroup:'D', flavourId:'coffee', label:'Coffee → Group D' };

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ---------------- Seed data ---------------- */
function seedFlavours(){
  const f = (o)=>Object.assign({
    id:uid('fl'), active:true, isSpecial:false, popular:false,
    par:2, yieldPotsPerBladder:2.5, prodTimeMinPerBladder:15,
    allergenNotes:'', washAlwaysAfter:false, notes:'', photoRef:'', groupUnconfirmed:false,
    components:[],
  }, o);
  const comp = (name, needsBaking)=>({id:uid('cmp'), name, needsBaking:!!needsBaking});
  let list = [
    // Group A — churned alone; the machine is washed after it by default (group of one)
    f({name:'Choc mint', group:'A', groupOrder:1, par:2, yieldPotsPerBladder:1.5}),

function seedStock(flavours){
  const stock = {};
  flavours.forEach((f,i)=>{
    // realistic-ish starting stock scattered across the priority spectrum
    const patterns = [3,2,1,0,4,2,1,3,0,2];
    const pots = patterns[i % patterns.length];
    stock[f.id] = {
      neg20: Math.ceil(pots*0.6), neg14: Math.floor(pots*0.4),
      bladders: (i%5===0)?0:(2+(i%4)),
      updatedAt: new Date().toISOString(),
    };
  });
  return stock;
}

async function loadAll(){
  const db = {};
  for(const key of StorageKeys){
    try{
      const res = await window.storage.get(key, true);
      db[key] = res ? JSON.parse(res.value) : null;
    }catch(e){ db[key] = null; }
  }
  let needsSeed = false;
  if(!db['flavours']){
    db['flavours'] = seedFlavours();
    needsSeed = true;
  }
  if(!db['stock']) db['stock'] = seedStock(db['flavours']);
  if(!db['specials']) db['specials'] = { current: db['flavours'].filter(f=>f.isSpecial).map(f=>f.id), archive: [] };
  if(!db['expiry-alerts']) db['expiry-alerts'] = [];
  if(!db['wash-config']) db['wash-config'] = { specialRule: SPECIAL_WASH_RULE, groups: JSON.parse(JSON.stringify(DEFAULT_GROUPS)) };
  if(!db['wash-config'].groups) db['wash-config'].groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS)); // migrate older saved data
  if(!db['shift-settings']) db['shift-settings'] = DEFAULT_SHIFT_SETTINGS;
  if(!db['production-plans']) db['production-plans'] = {};

  DB = db;
  if(needsSeed) await saveAll();
  return db;

function todayISO(d){ d = d||new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-AU',{weekday:'short', day:'numeric', month:'short'});
}
function alpha(list){ return [...list].sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'})); }
function snapQuarter(n){ return Math.max(0, Math.round(n*4)/4); }
function fmtNum(n){ return (Math.round(n*100)/100).toString(); }
function fmtPots(n){ const v = snapQuarter(n); return fmtNum(v) + ' pot' + (v===1?'':'s'); }
function nextChurnDates(count){
  const out = []; let d = new Date();
  let guard=0;
  while(out.length<count && guard<30){
    const wd = SHIFT_DAYS[d.getDay()];
    if(DB['shift-settings'].shifts[wd]) out.push(todayISO(d));
    d.setDate(d.getDate()+1); guard++;
  }
  return out;
}
function shiftMinutesFor(dateISO){
  const wd = SHIFT_DAYS[new Date(dateISO+'T00:00:00').getDay()];
  const sh = DB['shift-settings'].shifts[wd];
  if(!sh) return 0;
  const [sh1,sm1] = sh.start.split(':').map(Number);
  const [sh2,sm2] = sh.end.split(':').map(Number);
  return (sh2*60+sm2)-(sh1*60+sm1);
}

function stockTotal(flavourId){
  const s = DB.stock[flavourId] || {neg20:0,neg14:0,bladders:0};
  return (s.neg20||0)+(s.neg14||0);

function activeAlertsFor(flavourId){

function stockStatusColor(flavour){
  const total = stockTotal(flavour.id);
  const urgent = activeAlertsFor(flavour.id).some(a=>a.urgency==='today');
  if(urgent || total<=0) return 'red';

  return 'green';
}

/* ---------------- Recommendation engine ---------------- */
function buildCandidates(){
  const candidates = [];
  DB.flavours.filter(f=>f.active).forEach(f=>{
    const total = stockTotal(f.id);
    const bladders = (DB.stock[f.id]||{}).bladders || 0;
    const alerts = activeAlertsFor(f.id);
    const useToday = alerts.find(a=>a.urgency==='today');
    let tier=null, reason='', targetPots=null, forcedBladders=null;
    if(useToday){
      tier=1; reason=`Urgent: manually flagged to use today (${useToday.bladderCount} bladder${useToday.bladderCount==1?'':'s'})`;
      forcedBladders = useToday.bladderCount;
    } else if(total<=0){
      tier=2; reason='Critical: 0 pots in stock'; targetPots = Math.max(f.par,1);
    } else if(total<=1){
      tier=3; reason=`Low stock: ${fmtPots(total)} remaining`; targetPots = f.par;
    } else if(f.popular && total<2){
      tier=4; reason=`Popular flavour: ${fmtNum(total)} of 2 target pots available`; targetPots = Math.max(2,f.par);
    } else if(total<f.par){
      tier=5; reason=`Below PAR: ${fmtNum(total)} pots, target is ${fmtNum(f.par)}`; targetPots = f.par;
    }
    if(tier===null) return;
    let bladdersNeeded;
    if(forcedBladders!=null){ bladdersNeeded = Math.min(forcedBladders, bladders); }
    else {
      const potsNeeded = Math.max(0, targetPots - total);
      bladdersNeeded = Math.ceil(potsNeeded / f.yieldPotsPerBladder);
      bladdersNeeded = Math.min(bladdersNeeded, bladders);
    }
    const blocked = bladdersNeeded<=0 && bladders<=0;
    const severity = tier===5 ? (f.par-total) : (tier===1?99:0);
    candidates.push({
      flavourId:f.id, tier, reason, severity, bladdersNeeded,
      bladdersAvailable:bladders, blocked, currentPots:total, watchAlert: alerts.find(a=>a.urgency==='next'),
    });
  });
  candidates.sort((a,b)=> a.tier-b.tier || b.severity-a.severity);
  return candidates;
}

function estimateWashMinutes(selection){
  // selection: array of {flavourId, bladdersNeeded} in group/order sequence
  if(selection.length===0) return 0;
  const byFlavour = id=>DB.flavours.find(f=>f.id===id);
  let washes = 0;
  let lastGroup = null;
  const groupsTouched = [];
  selection.forEach((s,idx)=>{
    const f = byFlavour(s.flavourId);
    if(lastGroup && lastGroup!==f.group){
      const rule = DB['wash-config'].specialRule;
      if(rule && lastGroup===rule.fromGroup && f.group===rule.toGroup){
        const coffeeInSelection = selection.some(x=>x.flavourId===rule.flavourId);
        if(coffeeInSelection) washes++;
      } else {
        washes++;
      }
    }
    if(f.washAlwaysAfter) washes++;
    lastGroup = f.group;
  });
  return washes * DB['shift-settings'].washMin;
}

function allocateForDate(dateISO, candidates, excludeIds){
  const settings = DB['shift-settings'];
  const shiftMin = shiftMinutesFor(dateISO);
  const available = Math.max(0, shiftMin - settings.setupMin - settings.cleanMin);
  const byFlavour = id=>DB.flavours.find(f=>f.id===id);
  const chosen = []; const leftover = [];
  let prodMinutes = 0;
  candidates.forEach(c=>{
    if(excludeIds.has(c.flavourId)) return;
    if(c.blocked || c.bladdersNeeded<=0){ leftover.push(c); return; }
    const f = byFlavour(c.flavourId);
    const thisTime = c.bladdersNeeded * (f.prodTimeMinPerBladder||settings.defaultProdMinPerBladder);
    const trialWash = estimateWashMinutes([...chosen, c]);
    const projected = prodMinutes + thisTime + trialWash;
    if(projected <= available || chosen.length===0){
      chosen.push(c); prodMinutes += thisTime; excludeIds.add(c.flavourId);
    } else {
      leftover.push(c);
    }
  });
  const washMinutes = estimateWashMinutes(chosen);
  const planned = prodMinutes + washMinutes;
  return {
    date: dateISO, chosen, leftover,
    summary:{ shiftMin, setupMin:settings.setupMin, cleanMin:settings.cleanMin, available,
      prodMinutes, washMinutes, planned, spare: available-planned, overbooked: planned>available },
  };
}

async function generatePlans(){
  const [d0,d1] = nextChurnDates(2);
  const candidates = buildCandidates();
  const excludeIds = new Set();
  const plan0 = allocateForDate(d0, candidates, excludeIds);
  const plan1 = allocateForDate(d1, plan0.leftover, excludeIds);
  const existing0 = DB['production-plans'][d0];
  const existing1 = DB['production-plans'][d1];
  const mk = (alloc, existing)=>({
    date: alloc.date,
    recommended: alloc.chosen.map(c=>({flavourId:c.flavourId, bladders:c.bladdersNeeded, reason:c.reason, tier:c.tier})),
    approved: alloc.chosen.map(c=>({flavourId:c.flavourId, bladders:c.bladdersNeeded, note:''})),
    // Regenerating a plan (e.g. right after a delivery) must not wipe ticks
    // someone already made, so any progress on a still-open plan carries over.
    completed: (existing && existing.completed) || {},
    bakingCompleted: (existing && existing.bakingCompleted) || {},
    blocked: alloc.leftover.filter(c=>c.blocked).map(c=>({flavourId:c.flavourId, reason:c.reason, tier:c.tier})),
    summary: alloc.summary,
    generatedAt: new Date().toISOString(),
  });
  DB['production-plans'][d0] = mk(plan0, existing0);
  DB['production-plans'][d1] = mk(plan1, existing1);
  await save('production-plans');
  State.planDate = d0;
  return [d0,d1];
}

/* Baked components needed for a plan's approved flavours — staff prep these
   before the churner starts. Derived fresh from the plan each time, not stored. */
function getBakingItems(plan){
  if(!plan) return [];
  const items = [];
  plan.approved.forEach(a=>{
    const f = DB.flavours.find(x=>x.id===a.flavourId);
    if(!f || !f.components) return;
    f.components.filter(c=>c.needsBaking).forEach(c=>{
      items.push({flavourId:f.id, flavourName:f.name, group:f.group, componentId:c.id, name:c.name, key:`${f.id}_${c.id}`});
    });
  });
  return items;
}
function bakingKey(flavourId, componentId){ return `${flavourId}_${componentId}`; }

/* Build ordered churner sequence (with wash markers) from an approved list */
function buildSequence(approvedList){
  const byFlavour = id=>DB.flavours.find(f=>f.id===id);
  const items = approvedList.map(a=>({...a, f:byFlavour(a.flavourId)})).filter(x=>x.f);
  const byGroup = {};
  items.forEach(it=>{ (byGroup[it.f.group]=byGroup[it.f.group]||[]).push(it); });
  Object.values(byGroup).forEach(arr=>arr.sort((a,b)=>a.f.groupOrder-b.f.groupOrder));
  const groupsPresent = groupOrderIds().filter(g=>byGroup[g] && byGroup[g].length);
  const seq = [];
  groupsPresent.forEach((g,gi)=>{
    byGroup[g].forEach((it,ii)=>{
      seq.push({type:'flavour', flavourId:it.flavourId, bladders:it.bladders, group:g});
      if(it.f.washAlwaysAfter){
        seq.push({type:'wash', reason:`${it.f.name} always requires a wash after`, group:g});
      }
    });
    const nextGroup = groupsPresent[gi+1];
    if(nextGroup){
      const rule = DB['wash-config'].specialRule;
      let needWash = true;
      if(rule && g===rule.fromGroup && nextGroup===rule.toGroup){
        needWash = byGroup[g].some(it=>it.flavourId===rule.flavourId);
      }
      if(needWash){
        seq.push({type:'wash', reason:`Moving from Group ${g} to Group ${nextGroup}`, group:g});
      }
    }
  });
  return seq;
}

/* ---------------- WORKFLOW view (churner) ---------------- */
function workflowView(){
  const [d0] = nextChurnDates(1);
  const plan = getOrInitPlan(d0);
  if(!plan || plan.approved.length===0){
    return `<div class="page-head"><h1 class="page-title">Churn</h1><p class="page-sub">${fmtDate(d0)}</p></div>
    <div class="empty">${icon('churn')}<p>No approved plan yet for this churn day. Ask the manager to approve a plan, or generate one below.</p></div>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="doGeneratePlans()">${icon('plan')} Generate recommendations</button>`;
  }
  const seq = buildSequence(plan.approved);
  const byGroup = {};
  seq.forEach(step=>{ (byGroup[step.group]=byGroup[step.group]||[]).push(step); });
  const groupsPresent = groupOrderIds().filter(g=>byGroup[g]);
  const completed = plan.completed || {};

  if(!State.workflowGroup || !groupsPresent.includes(State.workflowGroup)){
    // auto pick first group with incomplete steps
    State.workflowGroup = groupsPresent.find(g=>!allStepsDone(byGroup[g], completed)) || groupsPresent[0];
  }

  const doneGroups = groupsPresent.filter(g=>allStepsDone(byGroup[g],completed));
  const activeSteps = byGroup[State.workflowGroup] || [];

  return `
  <div class="page-head"><h1 class="page-title">Churn — ${fmtDate(d0)}</h1><p class="page-sub">Pick a group to start, then work top to bottom.</p></div>

  <div class="subtabs">
    ${groupsPresent.map(g=>{ const gi=groupInfo(g); const done=allStepsDone(byGroup[g],completed);
      return `<button class="subtab ${State.workflowGroup===g?'active':''}" style="${done?'opacity:.55':''}" onclick="setWorkflowGroup('${g}')">
      <span class="gswatch" style="background:${gi.color};margin-right:5px;"></span>Group ${g}${done?' ✓':''}</button>`; }).join('')}
  </div>

  <div class="card">
    <div class="card-title">Group ${State.workflowGroup} — ${groupInfo(State.workflowGroup).name}</div>
    ${activeSteps.map((step,i)=>renderWorkflowStep(step,i,activeSteps,completed,plan.date)).join('')}
  </div>

  ${doneGroups.length===groupsPresent.length ? `
  <div class="card" style="background:var(--green-soft);border-color:var(--green-soft);text-align:center;">
    <div style="font-weight:700;color:var(--green-ink);">${icon('check')} All groups complete for this churn day 🎉</div>
  </div>` : ''}
  `;
}
function allStepsDone(steps, completed){ return steps.every((s,i)=>completed[stepKeyFromParts(s,i)]); }
function stepKeyFromParts(s,i){ return `${s.group}_${i}_${s.type}_${s.flavourId||'wash'}`; }

function renderWorkflowStep(step, idx, allSteps, completed, dateISO){
  const key = stepKeyFromParts(step, idx);
  const done = !!completed[key];
  // lock if any earlier step in this group isn't done
  const locked = !done && allSteps.slice(0,idx).some((s,i)=>!completed[stepKeyFromParts(s,i)]);
  if(step.type==='wash'){
    return `<div class="wash-step ${done?'done':''}" onclick="${locked?'':`toggleStep('${dateISO}','${key}')`}" style="${locked?'opacity:.4;cursor:not-allowed;':'cursor:pointer;'}">
      ${icon('wash')}<div class="wtext">WASH MACHINE — ${step.reason}</div>${done?icon('check'):''}
    </div>`;
  }
  const f = DB.flavours.find(x=>x.id===step.flavourId);
  if(!f) return '';
  return `<div class="churn-item ${done?'done':''} ${locked?'locked':''}" style="border-left-color:${groupInfo(f.group).color}">
    <div class="check-circle ${done?'checked':''}" onclick="${locked?'':`toggleStep('${dateISO}','${key}')`}">${done?icon('check'):''}</div>
    <div class="row-main"><div class="row-title">${f.name}</div><div class="row-meta">${step.bladders} bladder${step.bladders==1?'':'s'} · ~${Math.round(step.bladders*f.yieldPotsPerBladder*10)/10} pots</div></div>
  </div>`;
}

  </div>

    ${renderSellThrough()}
  </div>

    <div class="card-title">Frequently low</div>
    ${flagged.length===0?`<div class="empty">${icon('reports')}<p>No flavours are trending low yet.</p></div>`:

    <div class="row-meta">Below PAR in recent snapshots — consider increasing PAR or delivery volume.</div></div>
    <span class="badge b-amber">Watch</span></div>`).join('')}
  </div>
  `;
}
function renderSellThrough(){
  const hist = DB['stock-history'];
  if(hist.length<2) return `<p class="hint">Need at least two stock snapshots to estimate sell-through.</p>`;
  const last = hist[hist.length-1], prev = hist[hist.length-2];
  const rows = Object.keys(last.byFlavour||{}).map(fid=>{
    const f = DB.flavours.find(x=>x.id===fid); if(!f) return null;
    const prevTotal = (prev.byFlavour[fid]||{}).total ?? 0;
    const curTotal = (last.byFlavour[fid]||{}).total ?? 0;
    const produced = (last.producedSince && last.producedSince[fid]) || 0;
    const sold = Math.max(0, prevTotal + produced - curTotal);
    return {name:f.name, group:f.group, sold};
  }).filter(Boolean).sort((a,b)=>b.sold-a.sold).slice(0,8);
  if(!rows.length) return `<p class="hint">Not enough data yet.</p>`;
  const max = Math.max(...rows.map(r=>r.sold),1);
  return rows.map(r=>`<div style="margin-bottom:9px;">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>${groupDot(r.group)} ${r.name}</span><span class="mono">${r.sold} pots</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(r.sold/max*100)}%;background:var(--copper);"></div></div>
  </div>`).join('');
}
function flavoursFrequentlyLow(){
  const hist = DB['stock-history'].slice(-6);
  if(hist.length<3) return [];
  const counts = {};
  hist.forEach(h=>Object.entries(h.byFlavour||{}).forEach(([fid,rec])=>{
    const f = DB.flavours.find(x=>x.id===fid); if(!f) return;
    if(rec.total<f.par) counts[fid]=(counts[fid]||0)+1;
  }));
  return Object.entries(counts).filter(([,c])=>c>=Math.ceil(hist.length*0.6)).map(([fid])=>DB.flavours.find(f=>f.id===fid)).filter(Boolean);
}

function adjustApproved(dateISO, flavourId, delta){
  const plan = DB['production-plans'][dateISO];
  const item = plan.approved.find(a=>a.flavourId===flavourId);
  item.bladders = Math.max(0, item.bladders+delta);
  save('production-plans');

}
function setApprovedValue(dateISO, flavourId, raw){
  const plan = DB['production-plans'][dateISO];
  const item = plan.approved.find(a=>a.flavourId===flavourId);
  const v = parseFloat(raw);
  item.bladders = Math.max(0, Math.round(isNaN(v)?item.bladders:v));
  save('production-plans');

}

function adjustCount(flavourId, phase, delta){
  if(!State.countDraft[flavourId]) State.countDraft[flavourId] = {neg20:(DB.stock[flavourId]||{}).neg20||0, neg14:(DB.stock[flavourId]||{}).neg14||0};
  State.countDraft[flavourId][phase] = snapQuarter((State.countDraft[flavourId][phase]||0)+delta);
  render();
}
function setCountValue(flavourId, phase, raw){
  if(!State.countDraft[flavourId]) State.countDraft[flavourId] = {neg20:(DB.stock[flavourId]||{}).neg20||0, neg14:(DB.stock[flavourId]||{}).neg14||0};
  const v = parseFloat(raw);
  State.countDraft[flavourId][phase] = snapQuarter(isNaN(v)?0:v);
  render();
}
async function commitStockCount(){
  const snapshot = { date: todayISO(), byFlavour:{}, totalPots:0, flavourCount:0, producedSince:{} };
  DB.flavours.forEach(f=>{
    const prevStock = DB.stock[f.id] || {neg20:0,neg14:0,bladders:0};
    const draft = State.countDraft[f.id];
    const neg20 = draft?.neg20 ?? prevStock.neg20;
    const neg14 = draft?.neg14 ?? prevStock.neg14;
    DB.stock[f.id] = {...prevStock, neg20, neg14, updatedAt:new Date().toISOString()};
    if(f.active){ snapshot.byFlavour[f.id]={total:neg20+neg14}; snapshot.totalPots+=neg20+neg14; snapshot.flavourCount++; }
  });
  // produced since last snapshot = sum of completed churner bladders * yield since last snapshot date
  const lastSnap = DB['stock-history'][DB['stock-history'].length-1];
  const sinceDate = lastSnap ? lastSnap.date : null;
  Object.entries(DB['production-plans']).forEach(([d,plan])=>{
    if(sinceDate && d<sinceDate) return;
    Object.keys(plan.completed||{}).forEach(key=>{
      // count each fully-completed flavour step once
    });
    plan.approved.forEach(a=>{
      const doneFlavourSteps = Object.keys(plan.completed||{}).filter(k=>k.includes('_flavour_'+a.flavourId));
      if(doneFlavourSteps.length){
        const f = DB.flavours.find(x=>x.id===a.flavourId); if(!f) return;
        snapshot.producedSince[a.flavourId] = (snapshot.producedSince[a.flavourId]||0) + a.bladders*f.yieldPotsPerBladder;
      }
    });
  });
  DB['stock-history'].push(snapshot);
  State.countDraft = {}; State.countPhase='neg20';
  await save('stock'); await save('stock-history');
  toast('Stock count saved — now log today\u2019s delivery');
  State.tab='stock'; State.stockSub='delivery'; render();
}

function adjustDelivery(flavourId, delta){
  State.deliveryDraft[flavourId] = Math.max(0, (State.deliveryDraft[flavourId]||0)+delta);

async function commitDelivery(){
  let any=false;
  Object.entries(State.deliveryDraft).forEach(([fid,qty])=>{
    if(qty>0){ any=true; const s = DB.stock[fid]||{neg20:0,neg14:0,bladders:0}; s.bladders=(s.bladders||0)+qty; s.updatedAt=new Date().toISOString(); DB.stock[fid]=s; }
  });
  if(!any){ toast('No quantities entered'); return; }
  State.deliveryDraft = {};
  await save('stock');
  // Prediction is deliberately re-run right here: it should reflect today's

  await generatePlans();

  State.tab='today'; render();
}

/* Captures every editable field on the flavour modal back into State.modal.
   Must run before any action that re-renders the modal without saving
   (adding/removing a component, arming the delete confirm) — otherwise the
   re-render rebuilds the form from the stale snapshot taken when the modal
   was first opened, silently discarding whatever the person just typed. */
function syncFlavourModalFromDOM(){
  if(!State.modal || State.modal.type!=='flavour') return;
  const el = id => document.getElementById(id);
  if(el('fName')) State.modal.name = el('fName').value;
  if(el('fGroup')) State.modal.group = el('fGroup').value;
  if(el('fOrder')) State.modal.groupOrder = Number(el('fOrder').value)||1;
  if(el('fPar')) State.modal.par = Number(el('fPar').value)||0;
  if(el('fYield')) State.modal.yieldPotsPerBladder = Number(el('fYield').value)||1;
  if(el('fNotes')) State.modal.notes = el('fNotes').value;
  if(el('fPopular')) State.modal.popular = el('fPopular').checked;
  if(el('fSpecial')) State.modal.isSpecial = el('fSpecial').checked;
  if(el('fWash')) State.modal.washAlwaysAfter = el('fWash').checked;
  if(el('fActive')) State.modal.active = el('fActive').checked;
  syncComponentsFromDOM();
}

async function saveFlavour(){
  syncComponentsFromDOM();
  const data = {
    name: document.getElementById('fName').value.trim(),
    group: document.getElementById('fGroup').value,
    groupOrder: Number(document.getElementById('fOrder').value)||1,
    par: Number(document.getElementById('fPar').value)||0,
    yieldPotsPerBladder: Number(document.getElementById('fYield').value)||1,
    notes: document.getElementById('fNotes').value,
    popular: document.getElementById('fPopular').checked,
    isSpecial: document.getElementById('fSpecial').checked,
    washAlwaysAfter: document.getElementById('fWash').checked,
    active: document.getElementById('fActive').checked,
    groupUnconfirmed: false,
    components: (State.modal.components||[]).filter(c=>c.name && c.name.trim()).map(c=>({id:c.id||uid('cmp'), name:c.name.trim(), needsBaking:!!c.needsBaking})),
  };
  // prodTimeMinPerBladder and allergenNotes are no longer editable here — for an
  // existing flavour the spread below leaves whatever value it already had
  // untouched; for a brand new flavour, capacity calc falls back to the shift's
  // default production time automatically when the field is absent.
  if(!data.name){ toast('Name is required'); return; }
  if(State.modal.id){
    const idx = DB.flavours.findIndex(f=>f.id===State.modal.id);
    DB.flavours[idx] = {...DB.flavours[idx], ...data};
  } else {
    const newF = {id:uid('fl'), ...data, photoRef:''};
    DB.flavours.push(newF);
    if(!DB.stock[newF.id]) DB.stock[newF.id] = {neg20:0,neg14:0,bladders:0,updatedAt:new Date().toISOString()};
    await save('stock');
  }
  await save('flavours');
  State.modal=null; toast('Flavour saved'); render();
}

async function deleteFlavourConfirmed(){
  const id = State.modal.id;

  delete DB.stock[id];
  DB['expiry-alerts'] = DB['expiry-alerts'].filter(a=>a.flavourId!==id);
  await save('flavours'); await save('stock'); await save('expiry-alerts');
  State.modal=null; toast('Flavour deleted'); render();
}
async function archiveSpecials(){
  const current = DB.flavours.filter(f=>f.isSpecial && f.active);
  if(!current.length){ toast('No current specials to archive'); return; }
  const label = new Date().toLocaleDateString('en-AU',{month:'long', year:'numeric'});
  DB.specials.archive.push({ label, names: current.map(f=>f.name), archivedAt:new Date().toISOString() });
  current.forEach(f=>{ f.active=false; });
  await save('flavours'); await save('specials');
  toast('Specials archived'); render();
}
async function archiveOneSpecial(id){
  const f = DB.flavours.find(x=>x.id===id && x.isSpecial);
  if(!f){ toast('Special not found'); return; }
  const label = `${f.name} (archived ${new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})})`;
  DB.specials.archive.push({ label, names:[f.name], archivedAt:new Date().toISOString() });
  f.active = false;
  await save('flavours'); await save('specials');
  toast(`${f.name} archived`); render();
}

async function renameGroup(id, name){
  const g = getGroups().find(x=>x.id===id);
  if(g && name.trim()){ g.name = name.trim(); await save('wash-config'); toast('Group renamed'); }
  render();
}
async function moveGroup(id, dir){
  const groups = getGroups();
  const idx = groups.findIndex(g=>g.id===id);
  const newIdx = idx+dir;
  if(idx<0 || newIdx<0 || newIdx>=groups.length) return;
  const tmp = groups[idx]; groups[idx]=groups[newIdx]; groups[newIdx]=tmp;
  await save('wash-config'); render();
}
async function addGroup(){
  const input = document.getElementById('newGroupName');
  const name = (input.value||'').trim();
  if(!name){ toast('Enter a group name'); return; }
  const groups = getGroups();
  const color = GROUP_COLOR_PALETTE[groups.length % GROUP_COLOR_PALETTE.length];
  groups.push({id:uid('grp'), name, color});
  await save('wash-config');
  toast('Group added'); render();
}
async function deleteGroup(id){
  const inUse = DB.flavours.some(f=>f.group===id);
  if(inUse){ toast('Reassign flavours out of this group before deleting it'); return; }
  const groups = getGroups();
  if(groups.length<=1){ toast('At least one group is required'); return; }
  DB['wash-config'].groups = groups.filter(g=>g.id!==id);
  await save('wash-config'); render();
}

function openBulkSpecialsModal(){ State.modal = {type:'bulkSpecials'}; render(); }
async function saveBulkSpecials(){
  const raw = document.getElementById('bulkNames').value;
  const names = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length){ toast('Paste at least one flavour name'); return; }
  let added=0, revived=0;
  names.forEach(name=>{
    const existing = DB.flavours.find(f=>f.name.toLowerCase()===name.toLowerCase());
    if(existing){
      existing.active = true; existing.isSpecial = true; existing.groupUnconfirmed = false;
      revived++;
    } else {
      const newF = {
        id:uid('fl'), name, active:true, isSpecial:true, popular:false,
        group:'A', groupOrder:90, par:2, yieldPotsPerBladder:2.5, prodTimeMinPerBladder:15,
        allergenNotes:'', washAlwaysAfter:false,
        notes:'This month\u2019s special \u2014 confirm group, allergens and yield.',
        photoRef:'', groupUnconfirmed:true,
      };
      DB.flavours.push(newF);
      DB.stock[newF.id] = {neg20:0,neg14:0,bladders:0,updatedAt:new Date().toISOString()};
      added++;
    }
  });
  await save('flavours'); await save('stock');
  State.modal=null;
  toast(`Added ${added+revived} special${added+revived==1?'':'s'}${revived?` (${revived} reused past settings)`:''}`);
  render();
}

function closeModal(){ State.modal=null; render(); }
function closeModalBackdrop(e){ if(e.target.classList.contains('modal-backdrop')) closeModal(); }

async function toggleStep(dateISO, key){
  const plan = DB['production-plans'][dateISO];
  if(!plan.completed) plan.completed = {};
  if(plan.completed[key]) delete plan.completed[key]; else plan.completed[key]=true;
  await save('production-plans');
  render();
}
async function toggleBaking(dateISO, key){
  const plan = DB['production-plans'][dateISO];
  if(!plan.bakingCompleted) plan.bakingCompleted = {};
  if(plan.bakingCompleted[key]) delete plan.bakingCompleted[key]; else plan.bakingCompleted[key]=true;
  await save('production-plans');
  render();
}

function wireGlobalEvents(){
  const bar = document.querySelector('.topbar');
  const app = document.getElementById('app');
  if(app && bar){
    app.onscroll = ()=>{ bar.classList.toggle('scrolled', app.scrollTop>4); };
  }
}

/* expose handlers */
Object.assign(window, {setRole,switchRole,setTab,goTab,setPlanDate,setBakeDate,setStockSub,setFlavourSub,setCountPhase,
  setWorkflowGroup,doGeneratePlans,adjustApproved,setApprovedValue,adjustCount,setCountValue,commitStockCount,
  adjustDelivery,setDeliveryValue,commitDelivery,
  openAlertModal,modalAdjust,modalSet,setModalBladderCount,saveAlert,resolveAlert,openFlavourModal,saveFlavour,
  requestDeleteFlavour,addComponentRow,removeComponentRow,archiveSpecials,archiveOneSpecial,
  openBulkSpecialsModal,saveBulkSpecials,renameGroup,moveGroup,addGroup,deleteGroup,
  closeModal,closeModalBackdrop,toggleStep,toggleBaking});

/* ---------------- Boot ---------------- */
(async function boot(){
  render();
  await loadAll();
  State.loaded = true;
  render();
})();
</script>
