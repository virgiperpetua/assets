<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Virginia Perpetua — Assets</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#f3f2f2;--text:#201e1d;--accent:#9b6ff3;--div:color-mix(in srgb,#201e1d 40%,transparent)}
    body{margin:0;font-family:Archivo,system-ui,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:960px;margin:0 auto;padding:48px 24px}
    h1{font-weight:800;letter-spacing:-.01em}
    .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px;margin:32px 0}
    figure{margin:0;border-bottom:2px solid var(--div);padding-bottom:12px}
    figcaption{font-size:12px;margin-top:8px}
    img{max-width:100%;height:auto;display:block}
    a{color:var(--accent)}
  </style>
</head>
<body>
<main>
  <h1>Virginia Perpetua — Assets</h1>
  <p>Brand binaries. Specs live in the repo README and <code>docs/design-export/</code>.</p>
  <div class="row">
    <figure><img src="logo/mark/dark/bg-none/512.png" alt="Dark mark"/><figcaption>Mark dark 512</figcaption></figure>
    <figure><img src="logo/mark/light/bg-none/512.png" alt="Light mark"/><figcaption>Mark light 512</figcaption></figure>
    <figure><img src="logo/wordmark/dark/bg-none/640.png" alt="Wordmark"/><figcaption>Wordmark dark</figcaption></figure>
    <figure><img src="photo/virginia-photo.png" alt="Portrait"/><figcaption>Portrait</figcaption></figure>
    <figure><img src="og-image/linkedin-banner.png" alt="Banner"/><figcaption>LinkedIn / OG</figcaption></figure>
  </div>
</main>
</body>
</html>
